# watchgh configuration (all keys optional; shown values are the defaults).
#
# Copy to your config directory to override:
#   macOS:  ~/Library/Application Support/watchgh/config.toml
#   Linux:  ~/.config/watchgh/config.toml
#
# Durations accept Go units (s, m, h) plus a day unit (d), e.g. "90s", "36h", "7d".
# A missing file — or any missing key — keeps the default below.

# How long an unread, actionable item may sit before it earns the DUE marker.
stale_after = "24h"

# Read/resolved events older than this are pruned; unread items are never removed.
retention = "7d"

# Spacing between the background polls wgh runs while it's open. The default is
# relaxed (5m) since desktop notifications pull you in and `R` forces an
# on-demand refresh; lower it for snappier updates. Minimum is 60s: the
# tracked-PR/review GraphQL polls key off this and get no server-side pacing, so
# anything lower is rejected to stay clear of GitHub's rate limits.
poll_floor = "5m"

# Desktop-notify only actionable events (review requested, assigned, changes
# requested, CI failed). Set false to be notified about every new event.
actionable_only_notify = true
