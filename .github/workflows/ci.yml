# The same gauntlet run by hand before every commit, enforced on PRs and pushes
# to main: format, vet, build (cgo-free, as the CLI ships), test, and a race
# pass. It's a free filter — unformatted or broken contributions fail here
# before they reach a human review.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # macOS runner: wgh is macOS-only (the TUI uses Darwin termios ioctls that
    # don't exist on Linux), so it can't build or test on ubuntu.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      - name: check
        run: make ci
